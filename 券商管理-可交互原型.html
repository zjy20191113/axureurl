<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>同道项目 · 券商管理高保真原型</title>
  <style>
    :root {
      --canvas:#f2f2f4; --surface:#fff; --text:#20242b; --muted:#697384;
      --line:#e5e7eb; --focus:#4c9ffe; --primary:#16a98d; --selection:#486bd8;
      --nav:#20292e; --nav-deep:#182025; --success:#16754b; --danger:#c9342f;
      --subtle:#f6f7f9; --shadow:0 8px 24px rgba(0,0,0,.08);
      --broker-ink:#29343b; --broker-secondary:#53616b; --broker-caption:#657580;
      --broker-line:#e1e7ea; --broker-control-line:#c9d3d9; --broker-inset:#f8fafb;
      --broker-action:#0b7864; --broker-action-hover:#076453; --broker-action-soft:#eaf6f2;
      --broker-danger-soft:#fff0ef; --broker-neutral-soft:#f0f3f5; --broker-warning:#875c17;
      --broker-window:#29373e; --broker-ease:cubic-bezier(.23,1,.32,1);
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html { -webkit-text-size-adjust:100%; }
    body { margin:0; background:var(--canvas); color:var(--text); font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; letter-spacing:0; -webkit-font-smoothing:antialiased; }
    button,input,select,textarea { font:inherit; letter-spacing:0; }
    button,a,summary { touch-action:manipulation; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.48; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
    a { color:#2368c4; }
    h1,h2,h3,p { margin-top:0; }
    .shell { padding:16px; min-height:100vh; }
    .project-head { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:58px; padding:10px 18px; background:#fff; border:1px solid rgba(0,0,0,.11); border-radius:8px; box-shadow:0 10px 32px rgba(0,0,0,.065),0 2px 8px rgba(0,0,0,.035); }
    .project-head h1 { margin:0; font-size:18px; line-height:1.25; }
    .project-head p { margin:4px 0 0; font-size:12px; color:var(--muted); }
    .project-actions { display:flex; align-items:center; gap:12px; flex-shrink:0; font-size:12px; color:var(--muted); }
    .prototype-layout { display:grid; grid-template-columns:minmax(380px,440px) minmax(0,1fr); gap:16px; align-items:start; margin-top:16px; }
    .change-log-panel,.prototype-column,.prototype-workspace { min-width:0; }
    .change-log-panel { align-self:stretch; contain:size; min-height:0; overflow-y:auto; scrollbar-gutter:stable; padding:16px; background:#fff; border:1px solid rgba(0,0,0,.11); border-radius:8px; box-shadow:var(--shadow); font-size:13px; }
    .change-log-panel h2 { font-size:17px; margin:0 0 12px; }
    .record-section + .record-section { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
    .record-empty { padding:10px 12px; color:var(--muted); background:var(--subtle); border:1px solid var(--line); border-radius:4px; font-size:12px; }
    .record-section p:last-child { margin-bottom:0; }
    .page-prd { overflow-wrap:anywhere; line-height:1.75; color:#384253; }
    .page-prd h3 { font-size:14px; margin:18px 0 8px; }
    .page-prd ul { padding-left:18px; }
    .page-prd li + li { margin-top:8px; }
    .prd-table { width:100%; table-layout:fixed; border-collapse:collapse; font-size:12px; }
    .prd-table th,.prd-table td { border-bottom:1px solid var(--line); text-align:left; vertical-align:top; padding:9px 8px; overflow-wrap:anywhere; }
    .prd-table th { width:90px; font-weight:500; background:var(--subtle); }
    .boundary { color:var(--muted); font-size:12px; padding-top:14px; margin-top:18px; border-top:1px dashed var(--line); }
    .review-note { padding:10px; margin-top:12px; background:#fff5dd; color:#77520d; border:1px solid #ead7aa; border-radius:4px; }
    .demo-tools summary { cursor:pointer; font-weight:600; }
    .demo-tools .field { margin-top:12px; }
    .demo-tools small { display:block; color:var(--muted); margin-top:8px; }
    .prototype-tabs { display:flex; gap:4px; overflow-x:auto; margin-bottom:10px; padding:0 2px; }
    .prototype-tab { display:inline-flex; gap:8px; align-items:center; justify-content:center; min-height:44px; flex-shrink:0; border:1px solid transparent; border-radius:6px; padding:8px 14px; background:transparent; color:#677181; font-size:14px; font-weight:600; white-space:nowrap; }
    .prototype-tab[aria-selected="true"] { color:#1760c5; background:#fff; border-color:#d7dce5; box-shadow:0 2px 4px #18203405; }
    .prototype-screen-wrap { position:relative; height:auto; overflow:auto; border:1px solid #dedee1; border-radius:8px; background:#fff; box-shadow:var(--shadow); }
    .prototype-pan { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .prototype-pan input { appearance:none; flex:1; min-width:0; margin:0; height:24px; background:transparent; cursor:ew-resize; }
    .prototype-pan input::-webkit-slider-runnable-track { height:12px; border:1px solid #d4dbe5; border-radius:4px; background:#e4e9ef; }
    .prototype-pan input::-webkit-slider-thumb { appearance:none; width:64px; height:10px; border-radius:3px; background:#74859d; }
    .prototype-pan input::-moz-range-track { height:10px; border:1px solid #d4dbe5; border-radius:4px; background:#e4e9ef; }
    .prototype-pan input::-moz-range-thumb { width:64px; height:10px; border:0; border-radius:3px; background:#74859d; }
    .icon { width:16px; height:16px; flex:0 0 16px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle; }
    .icon-button { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; flex:0 0 34px; padding:0; border:1px solid #d8dee8; border-radius:4px; color:#596576; background:#fff; position:relative; }
    [data-tip]::after { content:attr(data-tip); position:absolute; z-index:20; top:calc(100% + 6px); right:0; width:max-content; max-width:180px; padding:5px 8px; background:#252d35; color:#fff; border-radius:3px; font-size:12px; opacity:0; pointer-events:none; }
    [data-tip]:focus-visible::after { opacity:1; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; padding:6px 12px; border:1px solid #d5d9df; border-radius:3px; background:#fff; color:#404955; font-size:13px; font-weight:500; white-space:nowrap; }
    .button.primary { background:var(--primary); border-color:var(--primary); color:#fff; }
    .text-button { display:inline-flex; align-items:center; gap:4px; border:0; background:transparent; color:#2674b9; padding:4px 2px; font-size:13px; }
    .muted { color:var(--muted); }
    .admin { min-width:1220px; display:grid; grid-template-columns:180px minmax(0,1fr); background:#f1f4f5; min-height:820px; font-size:13px; color:var(--broker-ink); }
    .admin.brokers-page { min-width:2040px; }
    .admin.export-page { min-width:2880px; display:block; background:#fff; }
    .admin.export-page .admin-nav,.admin.export-page .admin-top { display:none; }
    .admin.export-page .business-page { border:0; }
    .export-summary { display:flex; gap:16px; align-items:baseline; margin-bottom:14px; color:#687580; }
    .export-summary .applied { flex:1; }
    .export-summary > span { white-space:nowrap; }
    .export-sheet { width:100%; table-layout:fixed; border-collapse:collapse; font-size:12px; }
    .export-sheet th,.export-sheet td { border:1px solid #dce3e1; padding:12px 10px; text-align:left; vertical-align:top; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.8; }
    .export-sheet thead .sheet-letters th { padding:4px 6px; text-align:center; font-weight:400; color:#6d7975; background:#f0f3f2; }
    .export-sheet thead .sheet-fields th { color:#255c4e; background:#e8f3ee; font-weight:600; vertical-align:middle; }
    .export-sheet .sheet-row { text-align:center; font-weight:400; color:#78837e; background:#f5f7f6; padding:12px 4px; }
    .export-sheet tbody tr:nth-child(even) td { background:#fafcfb; }
    .export-sheet tbody td:first-of-type { font-weight:500; color:#263f36; }
    .sheet-footer { display:flex; gap:24px; align-items:center; min-height:38px; padding:8px 12px; border:1px solid #dce3e1; border-top:0; background:#f5f7f6; color:#68776f; font-size:12px; }
    .sheet-footer strong { color:#26705b; font-weight:500; }
    .admin-nav { background:var(--nav); color:#98a4ac; }
    .admin-brand { height:52px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:600; color:#f0f3f4; border-bottom:1px solid #354046; }
    .profile { display:flex; align-items:center; gap:12px; padding:20px 16px; color:#fff; }
    .avatar { width:38px; height:38px; display:grid; place-items:center; color:#8d969c; background:#e5e7e9; border-radius:50%; }
    .profile small { display:flex; align-items:center; gap:6px; color:#c0d6cc; margin-top:4px; font-size:11px; }
    .profile small::before { content:""; width:5px; height:5px; border-radius:50%; background:#78c8a7; }
    .nav-group { padding:12px 16px; color:#d2d8db; background:#1d252a; display:flex; gap:8px; align-items:center; }
    .nav-link { display:flex; align-items:center; width:100%; min-height:44px; gap:9px; padding:10px 16px; border:0; border-radius:0; background:var(--nav-deep); color:#99a8b1; text-align:left; font-size:13px; }
    .nav-link[aria-current="page"] { background:var(--selection); color:#fff; }
    .nav-link .icon { width:14px; height:14px; flex-basis:14px; }
    .admin-content { min-width:0; }
    .admin-top { display:flex; align-items:center; justify-content:space-between; height:52px; background:#fff; padding:0 18px; border-bottom:1px solid #d6dce1; }
    .admin-path { display:flex; align-items:center; gap:10px; color:#485059; }
    .admin-user { color:#7c858c; display:flex; align-items:center; gap:8px; }
    .admin-main { padding:16px; }
    .business-page { background:#fff; padding:24px 20px; border-top:2px solid #dbe4e5; }
    .page-heading { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:24px; }
    .page-heading h2 { font-size:20px; line-height:1.4; margin:0; font-weight:650; color:var(--broker-ink); }
    .breadcrumbs { display:flex; gap:6px; align-items:center; color:#7f8992; font-size:12px; }
    .filters { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px 16px; }
    .field { display:flex; flex-direction:column; gap:6px; min-width:0; }
    .field > label,.field-label { font-size:12px; font-weight:500; color:var(--broker-secondary); }
    .field input,.field select,.field textarea,.filter-checks { width:100%; min-width:0; min-height:36px; border:1px solid var(--broker-control-line); border-radius:4px; padding:7px 10px; color:var(--broker-ink); background:#fff; font-size:13px; }
    .field select { color-scheme:light; cursor:pointer; }
    .field input:focus,.field select:focus,.field textarea:focus { border-color:var(--broker-action); background:#fff; }
    .field input:disabled,.field select:disabled,.field textarea:disabled { background:var(--broker-neutral-soft); color:var(--broker-caption); cursor:not-allowed; }
    .field input,.fee-rate-input,.export-sheet,.data-table { font-variant-numeric:tabular-nums; }
    .field textarea { resize:vertical; min-height:64px; line-height:1.6; }
    input::placeholder,textarea::placeholder { color:#9ba3aa; }
    .filter-checks { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .filter-checks label,.choices label { display:inline-flex; gap:6px; align-items:center; cursor:pointer; color:var(--broker-secondary); font-size:13px; }
    .admin .choices label,.work-window .choices label { min-height:30px; padding:3px 6px; border-radius:3px; }
    .admin .choices label:has(input:checked),.work-window .choices label:has(input:checked) { background:var(--broker-action-soft); color:var(--broker-action); }
    .admin .choices label:has(input[value="终止"]:checked),.work-window .choices label:has(input[value="终止"]:checked) { background:var(--broker-danger-soft); color:var(--danger); }
    input[type="checkbox"],input[type="radio"] { accent-color:var(--primary); width:15px; height:15px; margin:0; flex:0 0 15px; }
    .filter-footer { display:flex; align-items:center; justify-content:space-between; margin:14px 0 16px; gap:12px; }
    .filter-footer .actions { display:flex; align-items:center; gap:8px; }
    .advanced { margin-top:12px; }
    .advanced summary { color:#697680; font-size:12px; cursor:pointer; width:max-content; }
    .advanced .filters { margin-top:12px; }
    .business-filters { display:grid; grid-template-columns:1.35fr 1fr; gap:24px; margin-top:16px; padding:20px 0 4px; border-top:1px solid var(--broker-line); }
    .business-filter-group > legend { margin-bottom:12px; font-size:13px; font-weight:650; color:var(--broker-ink); }
    .business-filter-group + .business-filter-group { border-left:1px solid #edf0f2; padding-left:24px; }
    .business-filter-group .filters { grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px 14px; }
    .business-filter-group[data-filter-business="swap"] .filters { grid-template-columns:minmax(0,1fr); }
    .business-filter-group .choices { gap:4px 8px; min-height:36px; }
    .business-filter-group .target-filter { grid-column:span 2; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:12px; padding-top:16px; border-top:1px solid var(--broker-line); }
    .toolbar .count { margin-left:auto; color:var(--broker-caption); font-size:12px; font-variant-numeric:tabular-nums; }
    .admin .button,.window-workspace .button { min-height:36px; border-radius:4px; padding:7px 12px; }
    .admin .button.primary,.window-workspace .button.primary { background:var(--broker-action); border-color:var(--broker-action); }
    .admin .text-button,.window-workspace .text-button { color:var(--broker-action); }
    .admin .icon-button { width:36px; height:36px; flex-basis:36px; border-color:var(--broker-control-line); }
    .admin .button,.admin .icon-button,.window-workspace .button,.window-workspace .icon-button { transition:transform 120ms var(--broker-ease); }
    .applied { color:#687580; font-size:12px; min-height:20px; overflow-wrap:anywhere; }
    .table-wrap { width:100%; overflow:auto; border:1px solid var(--broker-line); scrollbar-color:#98a8af #eff3f5; scrollbar-width:thin; }
    .data-table { width:100%; table-layout:fixed; border-collapse:collapse; font-size:13px; }
    .data-table th { text-align:left; height:44px; padding:10px 12px; font-weight:600; color:#505963; background:#fafbfc; border-right:1px solid #edf0f2; border-bottom:1px solid #e3e7eb; }
    .data-table td { padding:16px 12px; vertical-align:top; border-bottom:1px solid #edf0f2; border-right:1px solid #edf0f2; color:#4d5660; }
    .data-table tbody tr:last-child td { border-bottom:0; }
    .data-table .operation { width:84px; text-align:center; position:sticky; right:0; background:#fff; }
    .data-table th.operation { background:#fafbfc; }
    .broker-table th { text-align:center; height:36px; padding:8px 6px; background:#fafbfc; font-size:12px; font-weight:500; color:var(--broker-secondary); }
    .broker-table thead tr:first-child th { height:40px; color:var(--broker-ink); background:#f0f4f5; font-weight:650; border-bottom-color:#d8e1e5; }
    .broker-table thead tr:first-child th:nth-child(2) { background:#edf5f2; }
    .broker-table thead tr:first-child th:nth-child(3) { background:#f0f3f7; }
    .broker-table thead tr:first-child th:nth-child(4) { background:#f3f4ef; }
    .broker-table td { text-align:center; padding:16px 8px; vertical-align:middle; font-size:12px; overflow-wrap:anywhere; color:var(--broker-secondary); }
    .broker-table .broker-name,.broker-table .fee-cell { text-align:left; }
    .broker-table .broker-text { text-align:left; white-space:pre-wrap; vertical-align:top; line-height:1.8; }
    .broker-table td strong { margin-bottom:2px; font-size:13px; }
    .broker-table .tags { justify-content:center; margin-top:0; gap:3px; }
    .broker-table .tag { padding:2px 5px; background:#edf1f3; color:#586a75; }
    .broker-table .group-start { border-left:2px solid #dce5e8; }
    .broker-table tbody tr:nth-child(odd of [data-broker-id]) > td { background:#f8fafb; }
    .broker-table td.operation { border-left:1px solid var(--broker-line); }
    .broker-table .row-actions { gap:3px; }
    .broker-table .operation { width:auto; }
    .data-table td strong { font-weight:600; color:#333e48; display:block; margin-bottom:4px; }
    .data-table small { color:var(--broker-caption); display:block; margin-top:4px; line-height:1.6; }
    .data-table .clip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
    .data-table .summary-line { display:block; margin-top:7px; font-size:12px; color:#6e7a84; }
    .status { display:inline-flex; align-items:center; gap:5px; padding:3px 6px; border-radius:3px; color:var(--success); background:#edf7f1; font-size:12px; line-height:1.5; white-space:nowrap; }
    .status::before { content:""; width:5px; height:5px; flex:0 0 5px; border-radius:50%; background:currentColor; }
    .status.terminated { color:var(--danger); background:var(--broker-danger-soft); }
    .status.closed { color:#65717b; background:var(--broker-neutral-soft); }
    .status.disabled { color:var(--broker-warning); background:#fff6e8; }
    .tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
    .tag { display:inline-block; font-size:11px; line-height:1.5; background:#f0f3f6; color:#6b7786; padding:2px 6px; border-radius:3px; }
    .row-actions { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .row-actions .icon-button { width:28px; height:28px; flex-basis:28px; background:var(--primary); color:#fff; border-color:var(--primary); }
    .fee-line { white-space:pre-wrap; overflow-wrap:anywhere; padding:8px 0; border-bottom:1px solid #e7eaee; font-size:12px; }
    .fee-line:first-child { padding-top:0; }
    .fee-line:last-child { border-bottom:0; }
    .fee-market-group + .fee-market-group { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
    .fee-market-label { display:block; margin-bottom:5px; font-size:12px; color:var(--broker-caption); }
    .fee-line b { display:block; font-weight:600; margin-bottom:4px; color:var(--broker-ink); }
    .fee-description { color:var(--broker-secondary); line-height:1.8; }
    .broker-table td.market-rule-cell { text-align:left; vertical-align:top; }
    .market-rule-line { padding:6px 0; border-bottom:1px solid var(--broker-line); white-space:pre-wrap; overflow-wrap:anywhere; }
    .market-rule-line:first-child { padding-top:0; }
    .market-rule-line:last-child { border-bottom:0; }
    .market-rule-line b { display:block; color:var(--broker-ink); font-weight:600; margin-bottom:3px; }
    .fee-number { font-weight:600; font-variant-numeric:tabular-nums; color:var(--broker-ink); }
    .list-foot { display:flex; align-items:center; justify-content:space-between; gap:12px; padding-top:16px; font-size:12px; color:#7d8892; }
    .pagination { display:flex; gap:8px; align-items:center; }
    .page-count { padding:4px 10px; border:1px solid #d5e1ef; color:#2674b9; background:#eef4fa; border-radius:3px; }
    .empty { padding:44px 20px; text-align:center; color:#82909a; }
    .empty .icon { width:28px; height:28px; margin-bottom:10px; }
    .empty strong { display:block; font-weight:500; color:#55616d; font-size:14px; margin-bottom:6px; }
    .empty p { font-size:12px; margin-bottom:10px; }
    .message { color:var(--danger); font-size:12px; background:#fff4f3; border:1px solid #efcfca; border-radius:3px; padding:9px 12px; margin-bottom:12px; }
    .message:empty { display:none; }
    .dialog { width:min(860px,calc(100% - 32px)); max-height:calc(100dvh - 40px); padding:0; border:0; border-radius:4px; overflow:hidden; color:var(--text); background:#fff; box-shadow:0 12px 48px #18202545; }
    .dialog.small { width:min(480px,calc(100% - 32px)); }
    .dialog::backdrop { background:#20292e66; }
    .dialog-frame { display:flex; flex-direction:column; max-height:calc(100dvh - 40px); }
    .dialog-header { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; padding:12px 20px; background:var(--broker-window); color:#fff; }
    .dialog-header h2 { font-size:16px; margin:0; font-weight:600; }
    .dialog-header .icon-button { border:0; background:transparent; color:#c7d1d7; }
    .dialog-body { padding:24px; overflow-y:auto; overscroll-behavior:contain; min-height:0; scrollbar-gutter:stable; }
    .dialog-footer { display:flex; justify-content:flex-end; gap:8px; padding:12px 24px; background:#f8fafb; border-top:1px solid var(--broker-line); flex-shrink:0; }
    .dialog-footer .primary { background:var(--broker-action); border-color:var(--broker-action); }
    .form-section { padding-bottom:18px; }
    .form-section + .form-section { padding-top:16px; border-top:1px solid var(--line); }
    .form-section h3 { display:flex; align-items:center; gap:8px; font-size:14px; font-weight:650; margin:0 0 16px; color:var(--broker-ink); }
    .form-section h3::before { content:""; width:3px; height:14px; background:#a9c8bd; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px 24px; }
    .form-grid .wide { grid-column:1/-1; }
    .market-rules { margin-top:22px; }
    .market-rules h3 { font-size:14px; margin:0 0 12px; }
    .market-rule-head,.market-rule-editor { display:grid; grid-template-columns:116px minmax(0,1fr) minmax(0,1fr); gap:16px; }

    const market = `<fieldset class="field"><legend class="field-label">市场<span class="required">*</span></legend><div class="choices">${feeMarkets.map((value,i) => `<label><input type="checkbox" ${i === 0 ? `id="fee-market-${index}"` : ""} name="fee-market-${index}" data-fee-field="market" value="${value}" ${marketsOf(row).includes(value) ? "checked" : ""}>${value}</label>`).join("")}</div></fieldset>`;
    const project = projectById(row.project);
    const picker = `<div class="field"><label id="fee-project-label-${index}">收费项目<span class="required">*</span></label><details class="fee-project-picker"><summary aria-labelledby="fee-project-label-${index} fee-project-value-${index}"><span id="fee-project-value-${index}">${esc(project ? project.name + (project.enabled ? "" : "（已停用）") : "请选择收费项目")}</span></summary><div class="fee-project-options"><input type="search" id="fee-search" aria-label="搜索收费项目" placeholder="搜索项目名称" autocomplete="off"><select size="4" id="fee-project-${index}" aria-labelledby="fee-project-label-${index}" data-fee-field="project"><option value="">请选择收费项目</option>${options.map(p => `<option value="${p.id}" ${p.id === row.project ? "selected" : ""}>${esc(p.name)}${p.enabled ? "" : "（已停用）"}</option>`).join("")}</select><span class="fee-search-state" role="status"></span></div></details></div>`;
    const limit = (key,label) => `<div class="field"><label for="fee-${key}-${index}">${label}</label><div class="fee-rate-input"><input id="fee-${key}-${index}" data-fee-field="${key}" inputmode="decimal" autocomplete="off" placeholder="未配置" value="${esc(row[key] ?? "")}"><span>金额</span></div></div>`;
    return `<section class="fee-editor" data-rule-key="${esc(row.key)}" aria-label="收费规则字段">
      ${market}
      <p class="helper" style="margin-top:10px">费用币种跟随标的币种</p>
      <div class="fee-rule-fields">${picker}${direction}${field("method","计算方式",feeMethods)}${field("rounding","舍入方式",feeRoundings)}${field("decimals","小数位数",feeDecimals)}<div class="field"><label for="fee-rate-${index}">收费费率<span class="required">*</span></label><div class="fee-rate-input"><input id="fee-rate-${index}" data-fee-field="rate" inputmode="decimal" autocomplete="off" value="${esc(row.rate)}" ${!row.method ? "disabled" : ""} aria-describedby="fee-unit-${index} fee-rate-hint-${index}"><span id="fee-unit-${index}">${feeUnit(row.method)}</span></div><p class="helper" id="fee-rate-hint-${index}">${!row.method ? "请先选择计算方式" : feeRateResets.has(row.key) && !row.rate ? "计算方式已变更，请重新填写收费费率。" : ""}</p></div>${limit("minimum","最低收费")}${limit("maximum","最高收费")}</div></section>`;
  }
  function startFee(index = null) {
    readBrokerForm(); feeIndex = index;
    feeDraft = index === null ? blankFee() : {...structuredClone(draft.fees[index]),market:[...marketsOf(draft.fees[index])],minimum:draft.fees[index].minimum ?? "",maximum:draft.fees[index].maximum ?? ""};
    feeOriginal = structuredClone(feeDraft);
    renderBusinessForm(); currentWindow.root.querySelector(".fee-subpage-head").scrollIntoView({block:"start"});
    $("fee-market-" + (index ?? draft.fees.length)).focus({preventScroll:true});
  }
  function cancelFee() {
    readBrokerForm();
    const back = () => { feeDraft = null; feeOriginal = null; feeIndex = null; renderBusinessForm(); $("business-fields").querySelector('[data-action="add-fee"]').focus({preventScroll:true}); };
    if (JSON.stringify(feeDraft) !== JSON.stringify(feeOriginal)) confirmAction("放弃本条规则修改？","返回列表将丢弃本条规则尚未保存的输入，其他规则保留。",back,"放弃修改","继续编辑");
    else back();
  }
  function feeValidation(row) {
    if (!marketsOf(row).length || marketsOf(row).some(value => !feeMarkets.includes(value))) return ["market","请选择至少一个收费市场。"];
    const project = projectById(row.project);
    const existing = original.fees.some(f => f.key === row.key && f.project === row.project);
    if (!project || (!project.enabled && !existing)) return ["project","请选择可用收费项目。"];
    if (!directionsOf(row).length || directionsOf(row).some(value => !feeDirections.includes(value))) return ["direction-focus","请选择至少一个收费方向。"];
    for (const [field,values,label] of [["method",feeMethods,"计算方式"],["rounding",feeRoundings,"舍入方式"],["decimals",feeDecimals,"小数位数"]]) {
      if (!values.includes(row[field])) return [field,`请选择${label}。`];
    }
    const validAmount = value => /^\d+(?:\.\d+)?$/.test(value) && Number.isFinite(Number(value));
    if (!validAmount(row.rate)) return ["rate","请填写有效收费费率（非负数）。"];
    for (const [field,label] of [["minimum","最低收费"],["maximum","最高收费"]]) {
      if (row[field] !== "" && row[field] != null && !validAmount(row[field])) return [field,`请填写有效${label}（非负金额）。`];
    }
    if (row.minimum !== "" && row.maximum !== "" && Number(row.minimum) > Number(row.maximum)) return ["maximum","最高收费不能低于最低收费。"];
    return null;
  }
  function saveFee() {
    readBrokerForm();
    const error = feeValidation(feeDraft);
    if (error) {
      $("fee-error").textContent = error[1];
      const field = $("fee-" + error[0] + "-" + (feeIndex ?? draft.fees.length));
      const picker = field.closest(".fee-project-picker");
      if (picker) picker.open = true;
      field.focus(); refreshWindows(); return;
    }
    if (feeIndex === null) draft.fees.push(structuredClone(feeDraft));
    else draft.fees[feeIndex] = structuredClone(feeDraft);
    const index = feeIndex ?? draft.fees.length - 1;
    feeDraft = null; feeOriginal = null; feeIndex = null;
    renderBusinessForm(); $("business-fields").querySelector(`[data-action="edit-fee"][data-index="${index}"]`).focus({preventScroll:true});
  }
  function closeBroker() {
    if ($("broker-save")?.disabled) return;
    readBrokerForm();
    storeWindow();
    if (!windowDirty(currentWindow)) { finishWindow(); return; }
    confirmAction("放弃修改？","关闭后，本次未保存的修改将丢失。",() => finishWindow(),"放弃修改","继续编辑");
  }
  function brokerError(message,tab,selector) {
    formTab = tab; renderBusinessForm(); $("broker-error").textContent = message;
    const field = selector.startsWith("#") ? $(selector.slice(1)) : $("broker-dialog").querySelector(selector);
    field?.focus();
    $("broker-error").scrollIntoView({block:"nearest"});
  }
  function saveBroker(event) {
    event.preventDefault(); readBrokerForm();
    if (feeDraft) { saveFee(); return; }
    if (draft.option.exercise && !exerciseOptions.includes(draft.option.exercise)) { brokerError("请选择常规期权最快行权日的有效选项。","option","#option-exercise"); return; }
    const feesModified = JSON.stringify(draft.fees) !== JSON.stringify(original.fees);
    if (feesModified) {
      for (const [index,row] of draft.fees.entries()) {
        const error = feeValidation(row);
        if (error) { formTab = "fees"; startFee(index); $("fee-error").textContent = `第 ${index + 1} 条规则：${error[1]}`; $("fee-" + error[0] + "-" + index).focus(); return; }
      }
    }
    const pending = structuredClone(draft);
    simulateSave($("broker-save"),$("broker-error"),() => {
      if (pending.id) brokers[brokers.findIndex(b => b.id === pending.id)] = pending;
      else { pending.id = Math.max(...brokers.map(b => b.id),0) + 1; brokers.unshift(pending); }
      finishWindow(); renderPage(); toast("券商配置已保存");
    });
  }
  function simulateSave(button,error,success) {
    const owner = currentWindow, shouldFail = $("fail-save").checked;
    const controls = [...owner.root.querySelectorAll("input,select,textarea,button")].filter(el => !el.hasAttribute("data-window-minimize")).map(el => [el,el.disabled]);
    $("fail-save").checked = false;
    error.textContent = ""; button.disabled = true; button.textContent = "保存中…";
    controls.forEach(([el]) => { el.disabled = true; });
    setTimeout(() => {
      const previous = currentWindow;
      useWindow(owner);
      controls.forEach(([el,disabled]) => { el.disabled = disabled; });
      button.disabled = false; button.textContent = "保存";
      if (shouldFail) error.textContent = "保存失败，服务暂不可用。输入已保留，请重试。";
      else success();
      if (previous && workWindows.has(previous.key)) useWindow(previous);
      refreshWindows();
    },350);
  }
  function openDictionary(id) {
    const key = "dictionary:" + (id || "new");
    if (workWindows.has(key)) { activateWindow(workWindows.get(key),true); return; }
    createWindow("dictionary",key);
    editDictionaryId = id || null;
    const project = id ? projectById(id) : {name:"",enabled:true};
    dictionaryOriginal = JSON.stringify(project);
    $("dictionary-title").textContent = id ? "编辑收费项目" : "添加收费项目";
    $("dict-name").value = project.name;
    $("dict-status").innerHTML = ["启用","停用"].map((value,i) => `<label><input type="radio" name="dict-status" value="${i === 0}" ${project.enabled === (i === 0) ? "checked" : ""}>${value}</label>`).join("");
    $("dictionary-error").textContent = ""; refreshWindows(); $("dict-name").focus({preventScroll:true});
  }
  function closeDictionary() {
    if ($("dictionary-save").disabled) return;
    const current = {name:$("dict-name").value,enabled:currentWindow.root.querySelector('[name="dict-status"]:checked').value === "true"};
    const previous = JSON.parse(dictionaryOriginal);
    if (current.name === previous.name && current.enabled === previous.enabled) finishWindow();
    else confirmAction("放弃修改？","关闭后，本次未保存的修改将丢失。",() => finishWindow(),"放弃修改","继续编辑");
  }
  function saveDictionary(event) {
    event.preventDefault();
    const name = $("dict-name").value.trim();
    const enabled = currentWindow.root.querySelector('[name="dict-status"]:checked').value === "true";
    if (!name) { $("dictionary-error").textContent = "请输入项目名称。"; $("dict-name").focus(); return; }
    if (dictionary.some(p => p.id !== editDictionaryId && p.name === name)) { $("dictionary-error").textContent = "已有同名收费项目，请使用已有项目或修改名称。"; $("dict-name").focus(); return; }
    const execute = () => simulateSave($("dictionary-save"),$("dictionary-error"),() => {
      if (editDictionaryId) Object.assign(projectById(editDictionaryId),{name,enabled});
      else dictionary.push({id:Math.max(...dictionary.map(p => p.id),0) + 1,name,enabled});
      finishWindow(); renderPage(); refreshOpenFeeLists(); toast("收费项目已保存");
    });
    if (editDictionaryId && projectById(editDictionaryId).enabled && !enabled) confirmAction("停用收费项目？","停用后不可新增选择，已有券商配置保留。",execute,"停用");
    else execute();
  }
  function switchPage(next) {
    if (!["brokers","dictionary","export"].includes(next)) return;
    if (page === "brokers" && next === "export") brokerFilterDraft = {values:[...new FormData($("filters-form")).entries()],advanced:$("filters-form").querySelector(".advanced").open};
    if (next !== "export" && page !== "export") {
      mode = "normal"; filter = {}; dictionaryFilter = {}; brokerFilterDraft = null;
    }
    if (next === "dictionary") brokerFilterDraft = null;
    page = next; $("demo-state").value = mode;
    renderPage(); $("canvas").scrollLeft = 0; document.querySelector(".change-log-panel").scrollTop = 0;
    location.hash = next;
  }
  function refreshOpenFeeLists() {
    const previous = currentWindow;
    for (const item of workWindows.values()) {
      if (item.kind !== "broker") continue;
      useWindow(item);
      if (formTab === "fees" && !feeDraft) {
        const body = item.root.querySelector(".dialog-body"), scrollTop = body.scrollTop;
        readBrokerForm(); renderBusinessForm(); body.scrollTop = scrollTop;
      }
    }
    if (previous && workWindows.has(previous.key)) useWindow(previous);
    refreshWindows();
  }
  function activateFromEvent(event) {
    const root = event.target.closest(".work-window");
    if (!root || currentWindow?.root === root) return;
    const item = workWindows.get(root.dataset.windowKey);
    if (item) activateWindow(item);
  }
  document.addEventListener("pointerdown",activateFromEvent,true);
  document.addEventListener("focusin",activateFromEvent,true);
  document.addEventListener("click",event => {
    const button = event.target.closest("button");
    if (!button || button.disabled) return;
    activateFromEvent(event);
    if (button.hasAttribute("data-window-minimize")) { minimizeWindow(currentWindow); return; }
    if (button.dataset.windowRestore) { activateWindow(workWindows.get(button.dataset.windowRestore),true); return; }
    if (button.dataset.windowClose) {
      const item = workWindows.get(button.dataset.windowClose);
      activateWindow(item);
      item.kind === "broker" ? closeBroker() : closeDictionary();
      return;
    }
    if (button.dataset.page) { switchPage(button.dataset.page); return; }
    if (button.dataset.formTab) {
      if (feeDraft && button.dataset.formTab !== "fees") { toast("请先保存或取消当前收费规则"); return; }
      if ($("broker-save")?.disabled) return;
      readBrokerForm(); formTab = button.dataset.formTab; renderBusinessForm(); return;
    }
    const id = Number(button.dataset.id);
    switch (button.dataset.action) {
      case "add-broker": openBroker(); break;
      case "export-brokers": exportBrokers(); break;
      case "edit-broker": openBroker(id); break;
      case "close-broker": closeBroker(); break;
      case "close-dictionary": closeDictionary(); break;
      case "reset-filters": if (page === "dictionary") { dictionaryFilter = {}; renderDictionaryPage(); } else { filter = {}; brokerFilterDraft = null; mode = "normal"; $("demo-state").value = mode; page === "export" ? renderExportPage() : renderBrokerPage(); } break;
      case "reset-dictionary": dictionaryFilter = {}; renderDictionaryPage(); break;
      case "refresh": renderBrokerRows(); toast("列表已刷新"); break;
      case "retry": mode = "normal"; $("demo-state").value = mode; renderPage(); break;
      case "denied-back": switchPage(page === "brokers" ? "dictionary" : "brokers"); break;
      case "add-fee": startFee(); break;
      case "edit-fee": startFee(Number(button.dataset.index)); break;
      case "save-fee": saveFee(); break;
      case "cancel-fee": cancelFee(); break;
      case "remove-fee": readBrokerForm(); removedFees.push({index:Number(button.dataset.index),row:draft.fees.splice(Number(button.dataset.index),1)[0]}); renderBusinessForm(); break;
      case "undo-fee": readBrokerForm(); { const removed = removedFees.pop(); if (removed) draft.fees.splice(removed.index,0,removed.row); } renderBusinessForm(); break;
      case "add-dictionary": openDictionary(); break;
      case "edit-dictionary": openDictionary(id); break;
      case "toggle-dictionary": {
        const p = projectById(id);
        if (p.enabled) confirmAction("停用收费项目？","停用后不可新增选择，已有券商配置保留。",() => { p.enabled = false; renderDictionaryPage(); refreshOpenFeeLists(); toast("收费项目已停用"); },"停用");
        else { p.enabled = true; renderDictionaryPage(); refreshOpenFeeLists(); toast("收费项目已启用"); }
        break;
      }
    }
  });
  document.addEventListener("submit",event => {
    activateFromEvent(event);
    if (event.target.dataset.control === "broker-form") saveBroker(event);
    else if (event.target.dataset.control === "dictionary-form") saveDictionary(event);
    else if (event.target.id === "filters-form") {
      event.preventDefault();
      const data = new FormData(event.target);
      const multiFields = ["optionQuote","optionTarget","swapTarget"];
      filter = Object.fromEntries([...data.entries()].filter(([key]) => !multiFields.includes(key)));
      multiFields.forEach(key => { filter[key] = data.getAll(key); });
      Object.keys(filter).forEach(key => { if (typeof filter[key] === "string") filter[key] = filter[key].trim(); });
      renderBrokerRows();
    } else if (event.target.id === "dictionary-filters") {
      event.preventDefault();
      dictionaryFilter = {name:$("dictionary-query").value.trim(),status:$("dictionary-status").value === "启用" ? "true" : $("dictionary-status").value === "停用" ? "false" : ""};
      renderDictionaryPage();
    }
  });
  function filterFeeProjects(query) {
    query = query.trim();
    currentWindow.root.querySelectorAll(".fee-editor").forEach(row => {
      const select = row.querySelector('[data-fee-field="project"]'), selected = select.value;
      const existing = original.fees.some(f => f.key === row.dataset.ruleKey && String(f.project) === selected);
      const options = dictionary.filter(p => (p.enabled && p.name.includes(query)) || (String(p.id) === selected && (p.enabled || existing)));
      select.innerHTML = '<option value="">请选择收费项目</option>' + options.map(p => `<option value="${p.id}">${esc(p.name)}${p.enabled ? "" : "（已停用）"}</option>`).join("");
      select.value = selected;
      row.querySelector(".fee-search-state").textContent = !dictionary.some(p => p.enabled) ? "没有启用项目，请从独立菜单维护。" : !dictionary.some(p => p.enabled && p.name.includes(query)) ? "没有匹配项目；已选项目保留。" : "";
    });
  }
  document.addEventListener("input",event => {
    activateFromEvent(event);
    if (!event.target.closest(".work-window")) return;
    if (event.target.dataset.control === "fee-search") filterFeeProjects(event.target.value);
    if (currentWindow.kind === "broker") readBrokerForm();
    refreshWindows();
  });
  document.addEventListener("change",event => {
    activateFromEvent(event);
    if (event.target.closest(".work-window") && currentWindow.kind === "broker") readBrokerForm();
    if (event.target.dataset.feeField === "project") {
      const picker = event.target.closest(".fee-project-picker");
      picker.querySelector("summary span").textContent = event.target.selectedOptions[0]?.textContent || "请选择收费项目";
      picker.open = false;
      picker.querySelector("summary").focus({preventScroll:true});
    }
    if (event.target.name === "business-targets" && formTab === "option" && event.target.closest(".work-window")) {
      ruleMarkets.forEach(m => {
        const row = $("market-rule-fields").querySelector(`[data-rule-market="${m.key}"]`);
        row.hidden = !draft.option.targets.includes(m.target);
        row.querySelectorAll("textarea").forEach(input => { input.disabled = row.hidden; });
      });
      $("market-rule-fields").querySelector("[data-no-market]").hidden = Boolean(draft.option.targets.length);
    }
    if (event.target.closest(".work-window")) refreshWindows();
    if (event.target.dataset.feeField !== "method") return;
    const row = event.target.closest(".fee-editor");
    const index = feeIndex ?? draft.fees.length;
    feeDraft.rate = ""; feeRateResets.add(row.dataset.ruleKey);
    const scrollTop = $("broker-dialog").querySelector(".dialog-body").scrollTop;
    renderBusinessForm();
    $("broker-dialog").querySelector(".dialog-body").scrollTop = scrollTop;
    $("fee-method-" + index).focus({preventScroll:true});
  });
  $("demo-state").addEventListener("change",event => { mode = event.target.value; renderPage(); });
  $("confirm-cancel").addEventListener("click",() => { confirmCallback = null; $("confirm-dialog").close(); });
  $("confirm-accept").addEventListener("click",() => { const callback = confirmCallback; confirmCallback = null; $("confirm-dialog").close(); callback?.(); });
  $("window-compare").addEventListener("click",() => { compareWindows = !compareWindows; refreshWindows(); });
  window.addEventListener("resize",refreshWindows);
  document.addEventListener("keydown",event => {
    if (event.key === "Enter" && event.target.dataset.control === "fee-search") {
      event.preventDefault();
      event.target.closest(".fee-project-picker").querySelector("select").focus();
      return;
    }
    if (event.key !== "Escape" || $("confirm-dialog").open || !currentWindow || currentWindow.minimized) return;
    if (!event.target.closest(".work-window")) return;
    event.preventDefault();
    const picker = event.target.closest(".fee-project-picker[open]");
    if (picker) { picker.open = false; picker.querySelector("summary").focus(); return; }
    if (currentWindow.kind === "broker") { if (feeDraft) cancelFee(); else closeBroker(); }
    else closeDictionary();
  });
  document.querySelectorAll("dialog").forEach(dialog => {
    dialog.addEventListener("close",() => {
      document.body.style.overflow = document.querySelector("dialog[open]") ? "hidden" : "";
      const target = dialogFocus.get(dialog.id); if (target?.isConnected && target.getClientRects().length) target.focus({preventScroll:true});
    });
  });
  $("reset-demo").addEventListener("click",() => {
    confirmAction("重置本地演示？","本次本地修改将清除，恢复初始示例数据。",() => {
      if ([...workWindows.values()].some(w => w.root.querySelector('button[type="submit"]:disabled'))) { toast("正在保存，请稍后重置"); return; }
      workWindows.forEach(item => item.root.remove()); workWindows.clear(); currentWindow = null;
      seed(); filter = {}; dictionaryFilter = {}; brokerFilterDraft = null; mode = "normal";
      $("demo-state").value = mode; $("fail-save").checked = false; $("fail-export").checked = false; $("review-note").hidden = true;
      renderPage(); refreshWindows(); toast("已恢复初始演示数据");
    },"重置");
  });
  function syncPan() {
    const canvas = $("canvas"), maximum = Math.max(0,canvas.scrollWidth - canvas.clientWidth);
    $("pan").hidden = maximum <= 1; $("pan-range").max = maximum; $("pan-range").value = canvas.scrollLeft;
    $("pan-range").setAttribute("aria-valuetext",`已向右移动 ${Math.round(canvas.scrollLeft)}，共 ${maximum}`);
    $("pan-left").disabled = canvas.scrollLeft <= 1; $("pan-right").disabled = canvas.scrollLeft >= maximum - 1;
    alignTaskbar();
  }
  $("canvas").addEventListener("scroll",syncPan,{passive:true});
  $("pan-range").addEventListener("input",event => { $("canvas").scrollLeft = Number(event.target.value); syncPan(); });
  ["left","right"].forEach((direction,index) => $("pan-" + direction).addEventListener("click",() => { $("canvas").scrollLeft += (index ? 1 : -1) * Math.max(240,$("canvas").clientWidth * .75); syncPan(); }));
  new ResizeObserver(syncPan).observe($("canvas"));
  document.addEventListener("keydown",event => {
    if (!["ArrowLeft","ArrowRight","Home","End"].includes(event.key)) return;
    const tab = event.target.closest('[role="tab"]');
    if (!tab) return;
    const tabs = [...tab.parentElement.querySelectorAll('[role="tab"]')];
    let next = event.key === "Home" ? 0 : event.key === "End" ? tabs.length - 1 : (tabs.indexOf(tab) + (event.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
    event.preventDefault(); tabs[next].click();
    const target = $(tabs[next].id); target?.focus();
  });
  window.addEventListener("hashchange",() => { const next = location.hash.slice(1); if (next !== page && ["brokers","dictionary","export"].includes(next)) switchPage(next); });
  page = ["dictionary","export"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "brokers";
  mountIcons(); renderPage();
})();
</script>
</body>
