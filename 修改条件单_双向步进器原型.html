<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>修改条件单 | 双向价格步进器</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/4.7.0/css/font-awesome.css">
    <link rel="stylesheet" href="prototype-assets/edit-condition-order-stepper.css">
  </head>
  <body>
    <main class="stage">
      <section class="dialog-shell" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <header class="dialog-header">
          <h1 id="dialog-title">修改条件单</h1>
          <button class="icon-button close-button" type="button" aria-label="关闭" title="关闭">
            <i class="fa fa-times" aria-hidden="true"></i>
          </button>
        </header>

        <div class="instrument-line">
          <span class="instrument-meta numeric">G80000015 · F20260408 · 腾讯控股 (00700.HK)</span>
          <div class="instrument-quote" aria-label="标的当前行情">
            <span class="quote-price"><span>现价</span> <strong class="numeric">379.9200</strong></span>
            <span class="quote-change numeric">-2.80%</span>
          </div>
        </div>

        <div class="dialog-content">
          <div class="price-grid">
            <section class="price-card" aria-labelledby="monitor-price-title">
              <span class="field-icon field-icon-blue" aria-hidden="true">
                <i class="fa fa-eye"></i>
              </span>
              <div class="field-copy field-copy-with-help">
                <div class="field-title-row">
                  <h2 id="monitor-price-title">监控价</h2>
                  <button
                    class="helper-trigger"
                    type="button"
                    data-helper-trigger
                    aria-label="查看监控价说明"
                    aria-expanded="false"
                    aria-controls="monitor-price-help"
                    title="查看监控价说明"
                  ><i class="fa fa-question-circle" aria-hidden="true"></i></button>
                </div>
                <div id="monitor-price-help" data-helper-popover hidden role="tooltip">
                  当股价 ≤ 监控价时，系统将触发定价买入委托。
                </div>
              </div>
              <div class="price-stepper" data-price-stepper data-step="0.01" data-min="0.01">
                <button
                  class="stepper-button stepper-button-minus"
                  type="button"
                  data-step-action="decrease"
                  aria-label="降低监控价"
                  title="降低监控价"
                ><i class="fa fa-minus" aria-hidden="true"></i></button>
                <input class="price-input numeric" type="text" inputmode="decimal" value="380.00" data-stepper-value aria-label="监控价">
                <button
                  class="stepper-button stepper-button-plus"
                  type="button"
                  data-step-action="increase"
                  aria-label="提高监控价"
                  title="提高监控价"
                ><i class="fa fa-plus" aria-hidden="true"></i></button>
              </div>
            </section>

            <section class="price-card" aria-labelledby="order-price-title">
              <span class="field-icon field-icon-orange" aria-hidden="true">
                <i class="fa fa-diamond"></i>
              </span>
              <div class="field-copy field-copy-with-help">
                <div class="field-title-row">
                  <h2 id="order-price-title">委托价</h2>
                  <button
                    class="helper-trigger"
                    type="button"
                    data-helper-trigger
                    aria-label="查看委托价说明"
                    aria-expanded="false"
                    aria-controls="order-price-help"
                    title="查看委托价说明"
                  ><i class="fa fa-question-circle" aria-hidden="true"></i></button>
                </div>
                <div id="order-price-help" data-helper-popover hidden role="tooltip">
                  条件触发后，系统将以该价格向交易通道提交委托。
                </div>
              </div>
              <div class="price-stepper" data-price-stepper data-step="0.01" data-min="0.01">
                <button
                  class="stepper-button stepper-button-minus"
                  type="button"
                  data-step-action="decrease"
                  aria-label="降低委托价"
                  title="降低委托价"
                ><i class="fa fa-minus" aria-hidden="true"></i></button>
                <input class="price-input numeric" type="text" inputmode="decimal" value="379.50" data-stepper-value aria-label="委托价">
                <button
                  class="stepper-button stepper-button-plus"
                  type="button"
                  data-step-action="increase"
                  aria-label="提高委托价"
                  title="提高委托价"
                ><i class="fa fa-plus" aria-hidden="true"></i></button>
              </div>
            </section>
          </div>

          <section class="quantity-card" aria-labelledby="quantity-title">
            <div class="quantity-top">
              <div class="quantity-heading">
                <span class="field-icon field-icon-blue" aria-hidden="true">
                  <i class="fa fa-database"></i>
                </span>
                <div class="field-copy">
                  <h2 id="quantity-title">委托数量</h2>
                  <p>支持快捷比例选择</p>
                </div>
              </div>
              <div class="quantity-entry">
                <input class="quantity-input numeric" type="text" inputmode="numeric" value="50" aria-label="委托数量">
              </div>
            </div>

            <div class="ratio-options" role="group" aria-label="委托数量快捷比例">
              <button type="button">1/4</button>
              <button type="button">1/3</button>
              <button class="is-selected" type="button" aria-pressed="true">1/2</button>
              <button type="button">3/4</button>
              <button type="button">全仓</button>
            </div>

            <div class="account-summary">
              <span class="summary-item">持仓数量： <strong class="numeric">100</strong>股</span>
              <span class="summary-item" data-max-buy>最大可买数量： <strong class="numeric">100</strong>股</span>
              <span class="summary-item">可用购买力： <strong class="numeric">3,356.05</strong>元</span>
            </div>
          </section>

          <section class="deadline-card" aria-labelledby="deadline-title">
            <div class="deadline-heading">
              <span class="field-icon field-icon-green" aria-hidden="true">
                <i class="fa fa-clock-o"></i>
              </span>
              <div class="field-copy">
                <h2 id="deadline-title">截止时间</h2>
                <p>到期未触发则自动失效</p>
              </div>
            </div>
            <strong>当日收盘前</strong>
          </section>
        </div>

        <footer class="dialog-footer">
          <button class="text-button" type="button">取消</button>
          <button class="primary-button" type="button">保存修改</button>
        </footer>
      </section>
    </main>

    <script src="prototype-assets/edit-condition-order-stepper.js"></script>
  </body>
</html>
